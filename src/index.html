<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Concord</title><link rel="stylesheet" href="styles.css" /></head>
<body><main class="app-shell">
  <section class="login-screen" id="loginScreen"><img class="login-icon" src="../icon.png" alt="" /><h1>Concord</h1><button class="google-button" id="googleLogin"><span>G</span> Continuar com Google</button><p class="login-status" id="loginStatus"></p><details class="connection-settings"><summary>Configurar conexão</summary><input id="serverUrl" value="http://localhost:3000" autocomplete="url" aria-label="Endereço do servidor" /></details></section>
  <section class="home-screen hidden" id="homeScreen"><aside class="sidebar"><a class="brand" href="#"><img src="../icon.png" alt="" />Concord</a><div class="account"><img id="accountPicture" alt="" /><div><strong id="accountName"></strong><small id="accountEmail"></small></div></div><button class="nav-item active">Amigos</button><button class="sign-out" id="signOut">Sair</button><details class="connection-settings"><summary>Conexão</summary><input id="homeServerUrl" value="http://localhost:3000" autocomplete="url" aria-label="Endereço do servidor" /></details></aside><section class="friends-panel"><header><h1>Amigos</h1><button class="new-room" id="createRoom">Compartilhar tela</button></header><form class="add-friend" id="friendSearch"><input id="friendQuery" placeholder="Adicionar amigo" aria-label="Adicionar amigo" /><button type="submit">Buscar</button></form><div class="search-results hidden" id="searchResults"></div><section class="friend-section hidden" id="requestsSection"><h2>Pedidos</h2><div id="requests"></div></section><section class="friend-section"><h2>Seus amigos</h2><div class="friend-list" id="friends"><p class="empty-list">Nenhum amigo ainda.</p></div></section></section></section>
  <section class="room screen hidden" id="roomScreen"><div class="room-topbar"><button class="back-button" id="leaveRoom" aria-label="Voltar">‹</button><div class="room-id"><span>SALA</span><button id="copyRoomCode" title="Copiar código da sala">------</button></div><span class="connection-state" id="connectionState">Conectando</span></div><div class="share-layout"><section class="stage"><video id="remoteVideo" autoplay playsinline></video><video id="localPreview" autoplay muted playsinline></video><div class="empty-stage" id="emptyStage"><h2 id="emptyTitle">Aguardando</h2></div><div class="stream-bar hidden" id="streamBar"><span><i></i> AO VIVO</span><span>1080p · 30 FPS</span></div></section><aside class="room-sidebar"><section class="room-card"><span class="label">CÓDIGO</span><strong id="roomCode">------</strong><button class="copy-button" id="copyRoomCodeLarge">Copiar</button></section><div class="host-controls hidden" id="hostControls"><button class="primary-action" id="startShare">Compartilhar tela</button><button class="stop-button hidden" id="stopShare">Encerrar</button></div><div class="viewer-note hidden" id="viewerNote">Aguardando apresentador</div></aside></div></section>
</main><div class="toast hidden" id="toast" role="status"></div><script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script><script src="renderer.js"></script></body></html>
