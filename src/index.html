<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Screen share</title><link rel="stylesheet" href="styles.css" /></head>
<body><main class="app-shell">
  <section class="login-screen" id="loginScreen"><div class="login-actions"><button class="oauth-button discord" id="discordLogin"><svg class="discord-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 5.1A16.1 16.1 0 0 0 15.7 4l-.5 1a14 14 0 0 0-6.4 0l-.5-1a16 16 0 0 0-3.8 1.1C2.1 8.7 1.5 12.2 1.8 15.6A15.4 15.4 0 0 0 6.5 18l1.1-1.5a9.8 9.8 0 0 1-1.8-.9l.5-.4c3.5 1.6 7.8 1.6 11.3 0l.5.4c-.6.4-1.2.7-1.8.9l1.1 1.5a15.3 15.3 0 0 0 4.7-2.4c.4-3.9-.6-7.3-2.6-10.5ZM8.8 13.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z" fill="currentColor"/></svg> Continuar com Discord</button></div><p class="login-status" id="loginStatus"></p></section>
  <section class="home-screen hidden" id="homeScreen"><aside class="sidebar"><div class="account"><img id="accountPicture" alt="" /><div><strong id="accountName"></strong><small id="accountEmail"></small></div></div><button class="nav-item active">Amigos</button><button class="sign-out" id="signOut">Sair</button></aside><section class="friends-panel"><header><h1>Amigos</h1><button class="new-room" id="createRoom">Compartilhar tela</button></header><form class="add-friend" id="friendSearch"><input id="friendQuery" placeholder="Adicionar amigo" aria-label="Adicionar amigo" /><button type="submit">Buscar</button></form><div class="search-results hidden" id="searchResults"></div><section class="friend-section hidden" id="requestsSection"><h2>Pedidos</h2><div id="requests"></div></section><section class="friend-section"><h2>Seus amigos</h2><div class="friend-list" id="friends"><p class="empty-list">Nenhum amigo ainda.</p></div></section></section></section>
  <section class="room screen hidden" id="roomScreen"><div class="room-topbar"><button class="back-button" id="leaveRoom" aria-label="Voltar">‹</button><div class="room-id"><span>SALA</span><button id="copyRoomCode" title="Copiar código da sala">------</button></div><span class="connection-state" id="connectionState">Conectando</span></div><div class="share-layout"><section class="stage"><video id="remoteVideo" autoplay playsinline></video><video id="localPreview" autoplay muted playsinline></video><div class="empty-stage" id="emptyStage"><h2 id="emptyTitle">Aguardando</h2></div><div class="stream-bar hidden" id="streamBar"><span><i></i> AO VIVO</span><span>1080p · 30 FPS</span></div></section><aside class="room-sidebar"><section class="room-card"><span class="label">CÓDIGO</span><strong id="roomCode">------</strong><button class="copy-button" id="copyRoomCodeLarge">Copiar</button></section><div class="host-controls hidden" id="hostControls"><button class="primary-action" id="startShare">Compartilhar tela</button><button class="stop-button hidden" id="stopShare">Encerrar</button></div><div class="viewer-note hidden" id="viewerNote">Aguardando apresentador</div></aside></div></section>
</main><div class="toast hidden" id="toast" role="status"></div><script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script><script src="renderer.js"></script></body></html>
